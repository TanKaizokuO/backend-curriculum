# The abstraction that replaces tls_proxy.py. Same three jobs, declared
# instead of hand-coded: terminate TLS, pick a certificate by SNI, add
# forwarding headers, and enforce a body limit. One server block per
# hostname is how Nginx does SNI — the block whose server_name matches
# the name the client sent in the handshake supplies the certificate.

events {}

http {
  # Step 5 becomes one line instead of a manual Content-Length check.
  # Nginx checks it before reading the rest of the body, before proxy_pass
  # ever opens a connection to the origin.
  client_max_body_size 1k;

  server {
    listen 443 ssl;
    server_name bookmarks-api.local;

    ssl_certificate     /etc/nginx/certs/bookmarks-api.local.crt;
    ssl_certificate_key /etc/nginx/certs/bookmarks-api.local.key;

    location / {
      proxy_pass http://127.0.0.1:8030;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 443 ssl;
    server_name admin.bookmarks-api.local;

    ssl_certificate     /etc/nginx/certs/admin.bookmarks-api.local.crt;
    ssl_certificate_key /etc/nginx/certs/admin.bookmarks-api.local.key;

    location / {
      proxy_pass http://127.0.0.1:8030;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
