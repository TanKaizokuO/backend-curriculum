# The TypeScript twin's copy of Code/Lesson_15_code/nginx.conf — Nginx
# does not care which language the origin is written in, so the config is
# identical. One server block per hostname supplies SNI; the origin here
# is origin.ts on the same port as the Python origin.

events {}

http {
  client_max_body_size 1k;

  server {
    listen 443 ssl;
    server_name bookmarks-api.local;

    ssl_certificate     /etc/nginx/certs/bookmarks-api.local.crt;
    ssl_certificate_key /etc/nginx/certs/bookmarks-api.local.key;

    location / {
      proxy_pass http://127.0.0.1:8030;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }

  server {
    listen 443 ssl;
    server_name admin.bookmarks-api.local;

    ssl_certificate     /etc/nginx/certs/admin.bookmarks-api.local.crt;
    ssl_certificate_key /etc/nginx/certs/admin.bookmarks-api.local.key;

    location / {
      proxy_pass http://127.0.0.1:8030;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
