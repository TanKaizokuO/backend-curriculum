services:
  - type: web
    name: bookmarks-api-js
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    preDeployCommand: npm run migrate
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookmarks-db-js
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: bookmarks-db-js
    databaseName: bookmarks
    user: learner
    plan: free
