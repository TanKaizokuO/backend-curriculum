databases:
  - name: bookmarks-db
    databaseName: bookmarks
    plan: free
    region: oregon

services:
  - type: web
    name: bookmarks-api
    runtime: docker
    plan: starter
    region: oregon

    rootDir: Code/Lesson_7_code
    dockerfilePath: ./Dockerfile

    preDeployCommand: python migrate.py
    healthCheckPath: /healthz

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookmarks-db
          property: connectionString

      - key: APP_ENV
        value: production

      - key: LOG_LEVEL
        value: info
